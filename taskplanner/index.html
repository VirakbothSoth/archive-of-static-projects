<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tasks - TaskPlanner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="site.css" />
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-sm navbar-toggleable-sm navbar-light bg-white border-bottom box-shadow mb-3">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">TaskPlanner</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target=".navbar-collapse"
                        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="navbar-collapse collapse d-sm-inline-flex justify-content-between">
                    <ul class="navbar-nav flex-grow-1">
                        <li class="nav-item"><a class="nav-link text-dark active" href="#">Home</a></li>
                        <li class="nav-item"><a class="nav-link text-dark" href="#" id="privacyLink">Privacy</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="container">
        <main role="main" class="pb-3">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-500 mb-0" style="font-weight:500">Welcome!</h2>
                <span class="text-muted" style="font-size:13px" id="todayDate"></span>
            </div>

            <!-- STATS -->
            <div class="row g-2 mb-4">
                <div class="col-3">
                    <div class="rounded-3 p-3" style="background:var(--bs-light); border:0.5px solid #dee2e6">
                        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6c757d" class="mb-1">Total</div>
                        <div style="font-size:22px;font-weight:500" id="statTotal">0</div>
                    </div>
                </div>
                <div class="col-3">
                    <div class="rounded-3 p-3" style="background:var(--bs-light); border:0.5px solid #dee2e6">
                        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6c757d" class="mb-1">High priority</div>
                        <div style="font-size:22px;font-weight:500;color:#dc3545" id="statHigh">0</div>
                    </div>
                </div>
                <div class="col-3">
                    <div class="rounded-3 p-3" style="background:var(--bs-light); border:0.5px solid #dee2e6">
                        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6c757d" class="mb-1">Due soon</div>
                        <div style="font-size:22px;font-weight:500;color:#ffc107" id="statDueSoon">0</div>
                    </div>
                </div>
                <div class="col-3">
                    <div class="rounded-3 p-3" style="background:var(--bs-light); border:0.5px solid #dee2e6">
                        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6c757d" class="mb-1">Completed</div>
                        <div style="font-size:22px;font-weight:500;color:#198754" id="statCompleted">0</div>
                    </div>
                </div>
            </div>

            <!-- CONTROLS -->
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <div class="d-flex align-items-center gap-2">
                    <label for="sortSelect" class="text-muted" style="font-size:13px">Sort by</label>
                    <select id="sortSelect" class="form-select form-select-sm" style="width:auto">
                        <option value="default">Newest</option>
                        <option value="priority_desc">Priority (high → low)</option>
                        <option value="priority_asc">Priority (low → high)</option>
                        <option value="due_asc">Due date (soonest)</option>
                        <option value="due_desc">Due date (latest)</option>
                        <option value="title_asc">Title (A → Z)</option>
                        <option value="completed">Incomplete first</option>
                    </select>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-primary btn-sm rounded-pill px-3" id="addTaskBtn">+ Add Task</button>
                    <input type="text" id="taskSearch" class="form-control form-control-sm ms-2" placeholder="Search tasks..." style="width:200px; display:inline-block;" />
                    <div class="btn-group btn-group-sm" role="group" aria-label="View mode">
                        <button type="button" id="cardViewBtn" class="btn btn-outline-secondary active">Card view</button>
                        <button type="button" id="checklistViewBtn" class="btn btn-outline-secondary">Checklist view</button>
                    </div>
                </div>
            </div>

            <!-- CARD VIEW -->
            <div id="cardView"></div>

            <!-- CHECKLIST VIEW -->
            <div id="checklistView" style="display:none">
                <div class="rounded-3" id="checklistList" style="border:0.5px solid #dee2e6; background:#fff"></div>
            </div>

        </main>
    </div>

    <footer class="border-top footer text-muted">
        <div class="container">
            &copy; 2026 - TaskPlanner - <a href="#" id="privacyLink2">Privacy</a>
        </div>
    </footer>

    <!-- ADD / EDIT TASK MODAL -->
    <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content rounded-3">
          <div class="modal-header">
            <h5 class="modal-title" id="taskModalTitle" style="font-weight:500">New Task</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="taskForm">
                <input type="hidden" id="taskId" />

                <div class="mb-3">
                    <label class="mb-1" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#6c757d">Title</label>
                    <input id="fTitle" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label class="mb-1" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#6c757d">Description</label>
                    <input id="fDescription" class="form-control" />
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label class="mb-1" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#6c757d">Priority</label>
                        <select id="fPriority" class="form-select">
                            <option value="0">Low</option>
                            <option value="1" selected>Medium</option>
                            <option value="2">High</option>
                        </select>
                    </div>
                    <div class="col-sm-6">
                        <label class="mb-1" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#6c757d">End Date</label>
                        <input id="fEndDate" type="date" class="form-control" />
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label class="mb-1" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#6c757d">Hashtag</label>
                        <input id="fHashtag" class="form-control" placeholder="#tag" />
                    </div>
                    <div class="col-sm-6">
                        <label class="mb-1" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#6c757d">Comment</label>
                        <input id="fComment" class="form-control" />
                    </div>
                </div>

                <div class="mb-3">
                    <label class="mb-1 d-block" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#6c757d">Attachment</label>
                    <input type="file" id="fAttachment" class="form-control" />
                    <div id="fAttachmentCurrent" class="form-text"></div>
                </div>

                <div class="mb-3">
                    <label class="mb-1" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#6c757d">Parent Task</label>
                    <select id="fParentTaskId" class="form-select">
                        <option value="">-- None (Top Level Task) --</option>
                    </select>
                </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary rounded-pill px-4" id="saveTaskBtn">Create Task</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
