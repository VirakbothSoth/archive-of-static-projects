<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Digital Diary — Settings</title>

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="settings.css" />
    </head>
    <body>
        <header class="app-header">
            <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
                <div class="container">
                    <a class="navbar-brand d-flex align-items-center" href="#">
                        <strong>Digital Diary</strong>
                    </a>

                    <ul class="navbar-nav ms-3">
                        <li class="nav-item">
                            <a class="nav-link" href="home.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="homework.html"
                                >Homework</a
                            >
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Settings</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="gallery.html">Gallery</a>
                        </li>
                    </ul>

                    <div class="ms-auto d-flex align-items-center">
                        <img
                            src="virakboth.jpg"
                            alt="avatar"
                            class="avatar rounded-circle"
                            width="36"
                            height="36"
                        />
                    </div>
                </div>
            </nav>
        </header>

        <main class="container app-main mt-4 mb-4">
            <div class="text-center mb-4">
                <h2 class="mb-0">Settings</h2>
            </div>

            <div class="d-flex tabs-row mb-4">
                <div class="tab-flag">AVATAR</div>
                <div class="tab-flag">STUDENT'S INFO</div>
                <div class="tab-flag">CHANGE PASSWORD</div>
            </div>

            <div class="row gx-4">
                <!-- Avatar column -->
                <div class="col-md-3 text-center">
                    <div class="avatar-wrap mb-3">
                        <img
                            src="virakboth.jpg"
                            alt="Avatar"
                            class="avatar-large rounded-circle shadow-sm"
                        />
                    </div>
                    <div>
                        <input type="file" id="avatarInput" class="d-none" />
                        <label
                            for="avatarInput"
                            class="btn btn-secondary btn-sm"
                            >Choose photo</label
                        >
                    </div>
                </div>

                <!-- Student info form -->
                <div class="col-md-6">
                    <form class="student-form">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="First name"
                                    value="Virakboth"
                                />
                            </div>
                            <div class="col-md-6 mb-3">
                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Last name"
                                    value="Soth"
                                />
                            </div>

                            <div class="col-12 mb-3">
                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="Email"
                                    value="mail@example.com"
                                />
                            </div>

                            <div class="col-md-6 mb-3">
                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Phone number"
                                    value="+123456789"
                                />
                            </div>
                            <div class="col-md-6 mb-3">
                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Address"
                                    value="123 Main St"
                                />
                            </div>

                            <div class="col-12 mb-3">
                                dakota
                                <input
                                    type="url"
                                    class="form-control"
                                    placeholder="FB link"
                                    value="https://virakbothsoth.pages.dev/fb"
                                />
                            </div>

                            <div class="col-12">
                                <button class="btn btn-dark w-100">
                                    Save changes
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Change password form -->
                <div class="col-md-3">
                    <form class="password-form">
                        <div class="mb-3">
                            <input
                                type="password"
                                class="form-control"
                                placeholder="Old password"
                            />
                        </div>
                        <div class="mb-3">
                            <input
                                type="password"
                                class="form-control"
                                placeholder="New password"
                            />
                        </div>
                        <div class="mb-3">
                            <input
                                type="password"
                                class="form-control"
                                placeholder="Repeat password"
                            />
                        </div>
                        <div>
                            <button class="btn btn-dark w-100">
                                Change password
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer class="text-center text-muted small py-3">
            &copy; 2026 Academy
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
